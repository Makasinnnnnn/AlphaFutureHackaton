<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><title>Сравнение условий / Desktop</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F3F4F5" stroke="none"/><rect x="0" y="0" width="216" height="1040" rx="0" fill="#FFFFFF" stroke="none"/><rect x="216" y="0" width="1224" height="76" rx="0" fill="#FFFFFF" stroke="none"/><path d="M216 76H1440" fill="none" stroke="#E6E8EB"/><text x="28" y="46" font-family="Onest, Arial, sans-serif" font-size="37" font-weight="700" fill="#EF3124">А</text><rect x="29" y="51" width="24" height="4" rx="0" fill="#EF3124" stroke="none"/><text x="67" y="36" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="700" fill="#17212B">АЛЬФА</text><text x="67" y="53" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="500" fill="#69737D">БИЗНЕС</text><text x="264" y="44" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="600" fill="#17212B">ООО «Старт»</text><text x="1170" y="44" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="500" fill="#17212B">Помощь</text><rect x="1288" y="20" width="32" height="32" rx="16" fill="#F3F4F5" stroke="none"/><text x="1296" y="42" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="600" fill="#17212B">МК</text><text x="1332" y="42" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="500" fill="#17212B">Максим</text><text x="28" y="118" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Обзор</text><text x="28" y="170" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Платежи</text><text x="28" y="222" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Выписки</text><rect x="12" y="247" width="192" height="44" rx="8" fill="#FDEEEB" stroke="none"/><text x="28" y="274" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#EF3124">Кредитные продукты</text><text x="28" y="326" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Документы</text><text x="28" y="966" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="400" fill="#69737D">Синтетические данные</text><text x="28" y="986" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="400" fill="#69737D">Прототип для хакатона</text><text x="264" y="111" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Кредитные продукты  /  Заявка № 12</text><text x="264" y="166" font-family="Onest, Arial, sans-serif" font-size="36" font-weight="600" fill="#17212B">Платёж меньше. Срок длиннее.</text><text x="264" y="198" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" fill="#69737D">Сравните исходные и предлагаемые условия, прежде чем принять решение.</text><rect x="264" y="224" width="183" height="28" rx="6" fill="#FDEEEB" stroke="none"/><text x="274" y="243" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="500" fill="#EF3124">Предварительные условия</text><text x="264" y="284" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="500" fill="#167447">Заявка</text><path d="M326 279H418" fill="none" stroke="#E6E8EB"/><text x="438" y="284" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="500" fill="#167447">Проверка</text><path d="M511 279H603" fill="none" stroke="#E6E8EB"/><text x="623" y="284" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="600" fill="#17212B">Решение</text><path d="M699 279H791" fill="none" stroke="#E6E8EB"/><text x="811" y="284" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">Договор и выдача</text><rect x="264" y="318" width="744" height="585" rx="16" fill="#FFFFFF" stroke="none"/><text x="288" y="355" font-family="Onest, Arial, sans-serif" font-size="21" font-weight="600" fill="#17212B">Оборотный кредит · 2 500 000 ₽</text><text x="288" y="383" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">Сумма финансирования не меняется</text><rect x="761" y="409" width="223" height="60" rx="8" fill="#FDEEEB" stroke="none"/><text x="556" y="446" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="500" fill="#69737D">Вы запрашивали</text><text x="781" y="436" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="600" fill="#EF3124">Предлагаем</text><text x="781" y="456" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="400" fill="#EF3124">Более низкий платёж</text><path d="M288 469H984" fill="none" stroke="#E6E8EB"/><text x="288" y="498" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Срок</text><text x="556" y="498" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">6 месяцев</text><text x="781" y="498" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">9 месяцев</text><path d="M288 531H984" fill="none" stroke="#E6E8EB"/><text x="288" y="560" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Ставка годовых</text><text x="556" y="560" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">20,5%</text><text x="781" y="560" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">20,5%</text><path d="M288 593H984" fill="none" stroke="#E6E8EB"/><text x="288" y="622" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Платёж в месяц</text><text x="556" y="622" font-family="Onest, Arial, sans-serif" font-size="18" font-weight="600" fill="#17212B">441 931,47 ₽</text><text x="781" y="622" font-family="Onest, Arial, sans-serif" font-size="18" font-weight="600" fill="#EF3124">302 040,30 ₽</text><path d="M288 655H984" fill="none" stroke="#E6E8EB"/><text x="288" y="684" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Все платежи ≈</text><text x="556" y="684" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">2 651 588,82 ₽</text><text x="781" y="684" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">2 718 362,70 ₽</text><path d="M288 717H984" fill="none" stroke="#E6E8EB"/><text x="288" y="746" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Переплата ≈</text><text x="556" y="746" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">151 588,82 ₽</text><text x="781" y="746" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B">218 362,70 ₽</text><rect x="288" y="818" width="696" height="61" rx="8" fill="#F3F4F5" stroke="none"/><text x="304" y="843" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">На 139 891,17 ₽ меньше в месяц</text><text x="304" y="865" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">Общая переплата вырастет примерно на 66 773,88 ₽.</text><rect x="1032" y="318" width="360" height="454" rx="16" fill="#FFFFFF" stroke="none"/><text x="1056" y="356" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="600" fill="#17212B">Ваш следующий шаг</text><text x="1056" y="390" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Подтвердите удобный срок.</text><text x="1056" y="416" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">После этого подготовим договор</text><text x="1056" y="438" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">и точный график платежей.</text><rect x="1056" y="468" width="312" height="48" rx="10" fill="#EF3124" stroke="none"/><text x="1074" y="498" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Выбрать 9 месяцев</text><rect x="1056" y="528" width="312" height="48" rx="10" fill="#F3F4F5" stroke="none"/><text x="1074" y="558" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Отказаться от условий</text><path d="M1056 603H1368" fill="none" stroke="#E6E8EB"/><text x="1056" y="633" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Почему изменился срок</text><text x="1056" y="662" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">Более длинный срок снижает</text><text x="1056" y="684" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">нагрузку на денежный поток.</text><text x="1056" y="719" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="500" fill="#69737D">Решение демо-модели</text><text x="264" y="941" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Расчёт приблизительный: аннуитет, без комиссий и дополнительных услуг.</text><text x="264" y="962" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Окончательные условия и график — в договоре. Не является одобрением или офертой.</text></svg>
