<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Дозапрос документов / Desktop</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F3F4F5" stroke="none"/><rect x="0" y="0" width="216" height="1000" rx="0" fill="#FFFFFF" stroke="none"/><rect x="216" y="0" width="1224" height="76" rx="0" fill="#FFFFFF" stroke="none"/><path d="M216 76H1440" fill="none" stroke="#E6E8EB"/><text x="28" y="46" font-family="Onest, Arial, sans-serif" font-size="37" font-weight="700" fill="#EF3124">А</text><rect x="29" y="51" width="24" height="4" rx="0" fill="#EF3124" stroke="none"/><text x="67" y="36" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="700" fill="#17212B">АЛЬФА</text><text x="67" y="53" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="500" fill="#69737D">БИЗНЕС</text><text x="264" y="44" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="600" fill="#17212B">ООО «Старт»</text><text x="1170" y="44" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="500" fill="#17212B">Помощь</text><rect x="1288" y="20" width="32" height="32" rx="16" fill="#F3F4F5" stroke="none"/><text x="1296" y="42" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="600" fill="#17212B">МК</text><text x="1332" y="42" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="500" fill="#17212B">Максим</text><text x="28" y="118" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Обзор</text><text x="28" y="170" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Платежи</text><text x="28" y="222" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Выписки</text><rect x="12" y="247" width="192" height="44" rx="8" fill="#FDEEEB" stroke="none"/><text x="28" y="274" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#EF3124">Кредитные продукты</text><text x="28" y="326" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#17212B">Документы</text><text x="28" y="926" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="400" fill="#69737D">Синтетические данные</text><text x="28" y="946" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="400" fill="#69737D">Прототип для хакатона</text><text x="264" y="111" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Кредитные продукты  /  Заявка № 11</text><text x="264" y="166" font-family="Onest, Arial, sans-serif" font-size="36" font-weight="600" fill="#17212B">Нужен один документ</text><text x="264" y="198" font-family="Onest, Arial, sans-serif" font-size="15" font-weight="400" fill="#69737D">Заявка № 11 · Кредит на оборудование · 1 000 000 ₽ на 12 месяцев</text><rect x="264" y="234" width="744" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="288" y="258" width="167" height="28" rx="6" fill="#FDEEEB" stroke="none"/><text x="298" y="277" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="500" fill="#EF3124">Запрос специалиста</text><text x="288" y="317" font-family="Onest, Arial, sans-serif" font-size="23" font-weight="600" fill="#17212B">Уточните назначение платежей</text><text x="288" y="348" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Приложите пояснение по операциям с основным контрагентом.</text><text x="288" y="371" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Запрос от 21 октября · Ответ проверит кредитный специалист</text><rect x="264" y="416" width="744" height="352" rx="16" fill="#FFFFFF" stroke="none"/><text x="288" y="456" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="600" fill="#17212B">Пояснение по операциям</text><text x="288" y="485" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">PDF · Документ по текущему запросу</text><rect x="288" y="510" width="696" height="87" rx="10" fill="#F3F4F5" stroke="none"/><rect x="304" y="530" width="39" height="45" rx="6" fill="#FFFFFF" stroke="none"/><text x="310" y="558" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="600" fill="#EF3124">PDF</text><text x="359" y="540" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="500" fill="#17212B">Пояснение.pdf</text><text x="359" y="565" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">Загружен до текущего запроса.</text><text x="359" y="586" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A5C00">Для ответа приложите новый документ.</text><rect x="288" y="621" width="232" height="48" rx="10" fill="#F3F4F5" stroke="none"/><text x="306" y="651" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Добавить новый файл</text><text x="288" y="707" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A5C00">Новый файл ещё не приложен</text><text x="288" y="738" font-family="Onest, Arial, sans-serif" font-size="13" font-weight="400" fill="#69737D">После загрузки станет доступна отправка на проверку.</text><rect x="1032" y="234" width="360" height="390" rx="16" fill="#FFFFFF" stroke="none"/><text x="1056" y="273" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="600" fill="#17212B">Что будет дальше</text><rect x="1056" y="310" width="28" height="28" rx="14" fill="#FDEEEB" stroke="none"/><text x="1065" y="329" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="600" fill="#EF3124">1</text><text x="1098" y="323" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Добавьте документ</text><text x="1098" y="347" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">PDF по запросу специалиста</text><rect x="1056" y="396" width="28" height="28" rx="14" fill="#F3F4F5" stroke="none"/><text x="1065" y="415" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="600" fill="#69737D">2</text><text x="1098" y="409" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Отправьте на проверку</text><text x="1098" y="433" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Заявка вернётся специалисту</text><rect x="1056" y="482" width="28" height="28" rx="14" fill="#F3F4F5" stroke="none"/><text x="1065" y="501" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="600" fill="#69737D">3</text><text x="1098" y="495" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Получите решение</text><text x="1098" y="519" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Статус появится в кабинете</text><rect x="264" y="792" width="744" height="88" rx="12" fill="#FFFFFF" stroke="none"/><text x="288" y="843" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="400" fill="#69737D">Нужно приложить новый файл</text><rect x="734" y="812" width="250" height="48" rx="10" fill="#E2E5E8" stroke="none"/><text x="753" y="842" font-family="Onest, Arial, sans-serif" font-size="14" font-weight="600" fill="#8C949C">Отправить на проверку</text><text x="264" y="921" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="400" fill="#69737D">Старый файл остаётся в истории. Загрузка файла не означает одобрение заявки.</text></svg>
