name: Задача команды
description: Предложить работу или взять конкретную проверяемую задачу
title: '[TASK] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема и цель
      description: Что сейчас мешает пользователю, проверке кейса или работе команды?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options:
        - 'P0 — обязательный путь или критическая корректность'
        - 'P1 — ценность, надёжность или подготовка сдачи'
        - 'P2 — дополнительное улучшение'
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Объём и затрагиваемые части
      description: Границы работы, API/файлы, зависимости от других карточек
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Конкретные наблюдаемые результаты; можно оформить checklist
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Как проверить
      description: Сценарий, тест, ожидаемый результат; после работы добавить фактическое подтверждение
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Оценка и блокеры
      placeholder: Например, 1–3 часа; зависит от HACK-001
